<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="豊中市が公開する学校給食予定献立表を見やすく確認できる非公式Webサービスです。">
    <meta name="theme-color" content="#192B60">
    <title>豊中市 学校給食献立</title>
    <link rel="canonical" href="https://toyonaka-lunch.ogtm.dev/">
    <link rel="stylesheet" href="/styles.css">
    <script src="/app.js" type="module"></script>
  </head>
  <body class="min-h-screen bg-[#f7f8fb] text-slate-900 antialiased dark:bg-slate-950 dark:text-slate-100">
    <header class="bg-primary text-white">
      <div class="mx-auto flex max-w-6xl flex-col gap-3 px-4 py-3 sm:px-6 lg:flex-row lg:items-center">
        <h1 class="shrink-0 text-lg font-bold sm:text-xl">豊中市 学校給食献立</h1>
        <div class="grid flex-1 grid-cols-[auto_minmax(0,1fr)_auto] items-center gap-2 sm:flex sm:justify-end lg:ml-auto">
          <label for="source-select" class="text-xs font-semibold text-white/80">種別</label>
          <select id="source-select" class="col-span-2 w-full rounded-lg border border-white/30 bg-white px-3 py-2 text-sm text-slate-900 focus:border-white focus:outline-none focus:ring-2 focus:ring-white/50 sm:w-56"></select>
          <label for="month-select" class="col-start-1 row-start-2 text-xs font-semibold text-white/80">年月</label>
          <select id="month-select" class="col-start-2 row-start-2 min-w-0 rounded-lg border border-white/30 bg-white px-3 py-2 text-sm text-slate-900 focus:border-white focus:outline-none focus:ring-2 focus:ring-white/50 sm:w-32"></select>
          <button id="today-button" type="button" class="col-start-3 row-start-2 shrink-0 rounded-lg border border-white/50 bg-white/10 px-3 py-2 text-sm font-semibold text-white transition hover:bg-white/20 focus:outline-none focus:ring-2 focus:ring-white/70">今月</button>
        </div>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-5 sm:px-6 sm:py-6">
      <p id="source-description" class="mb-4 text-xs leading-relaxed text-slate-500 dark:text-slate-400">取得元を読み込んでいます。</p>

      <section aria-labelledby="menu-heading">
        <div class="mb-4 flex items-center justify-between gap-4">
          <div>
            <p id="menu-period" class="text-sm font-semibold text-primary dark:text-tertiary"></p>
            <h2 id="menu-heading" class="text-2xl font-bold">給食予定</h2>
          </div>
          <a id="source-link" class="hidden text-sm font-semibold text-primary underline decoration-primary/40 underline-offset-4 hover:decoration-primary dark:text-tertiary" target="_blank" rel="noopener noreferrer">豊中市の原資料</a>
        </div>

        <p id="status" class="rounded-2xl border border-slate-200 bg-white px-5 py-6 text-center text-slate-600 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-300" role="status" aria-live="polite">読み込み中です。</p>
        <div id="menu-list" class="grid gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>
    </main>

    <footer class="mt-10 border-t border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
      <div class="mx-auto max-w-6xl px-4 py-7 text-sm text-slate-600 dark:text-slate-300 sm:px-6">
        <p>豊中市公開の給食予定献立表を機械的に変換した非公式サービスです。最新情報や変更は各学校・豊中市の案内を確認してください。</p>
        <div class="mt-3 flex flex-col gap-2 border-t border-slate-200 pt-3 dark:border-slate-800 sm:flex-row sm:items-center sm:justify-between">
          <p>© 2026 Tomoya Ogawa</p>
          <nav class="flex flex-wrap gap-x-4 gap-y-2" aria-label="関連リンク">
            <a class="font-semibold text-primary underline underline-offset-4 dark:text-tertiary" href="/api">API情報</a>
            <a class="font-semibold text-primary underline underline-offset-4 dark:text-tertiary" href="https://github.com/ogatomo21/toyonaka-school-lunch" target="_blank" rel="noopener noreferrer">GitHub</a>
            <a class="font-semibold text-primary underline underline-offset-4 dark:text-tertiary" href="https://github.com/ogatomo21/toyonaka-school-lunch/blob/main/LICENSE" target="_blank" rel="noopener noreferrer">MIT License</a>
          </nav>
        </div>
      </div>
    </footer>
  </body>
</html>
